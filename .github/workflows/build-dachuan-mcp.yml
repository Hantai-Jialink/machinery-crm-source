name: Build DachuanPro MCP image

on:
  workflow_dispatch:
  push:
    branches:
      - codex/production-mcp-canary-gates
    paths:
      - .github/workflows/build-dachuan-mcp.yml

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
      ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
      MCP_IMAGE_TAG: 1.1.0-identity-poc

    steps:
      - name: Checkout MCP source
        uses: actions/checkout@v4
        with:
          ref: codex/production-mcp-canary-gates

      - name: Build DachuanPro MCP image
        shell: bash
        run: |
          set -euo pipefail
          image="$ACR_REGISTRY/$ACR_NAMESPACE/dachuan-mcp:$MCP_IMAGE_TAG"
          ci_dockerfile="$(mktemp)"
          trap 'rm -f "$ci_dockerfile"' EXIT
          python3 - "$ci_dockerfile" <<'PY'
          from pathlib import Path
          import sys

          source = Path('Dockerfile.mcp').read_text()
          original_corepack = 'RUN corepack enable\n'
          original_prisma_copy = 'RUN mkdir -p /runtime-prisma && cp -aL node_modules/.prisma /runtime-prisma/.prisma && cp -aL node_modules/@prisma /runtime-prisma/@prisma'
          pinned_corepack = 'RUN corepack enable\nRUN corepack prepare "pnpm@10.33.4" --activate\n'
          pnpm_virtual_store_copy = '''RUN set -eux; \\
              prisma_generated="$(find node_modules/.pnpm -type d -path '*/node_modules/.prisma' -print -quit)"; \\
              test -n "$prisma_generated"; \\
              test -d node_modules/@prisma; \\
              echo "PRISMA_GENERATED_PATH=$prisma_generated"; \\
              mkdir -p /runtime-prisma; \\
              cp -aL "$prisma_generated" /runtime-prisma/.prisma; \\
              cp -aL node_modules/@prisma /runtime-prisma/@prisma'''
          if source.count(original_corepack) != 1 or source.count(original_prisma_copy) != 1:
              raise SystemExit('Unexpected Dockerfile.mcp layout')
          Path(sys.argv[1]).write_text(
              source.replace(original_corepack, pinned_corepack).replace(original_prisma_copy, pnpm_virtual_store_copy)
          )
          PY
          grep -F 'corepack prepare "pnpm@10.33.4" --activate' "$ci_dockerfile"
          grep -F 'PRISMA_GENERATED_PATH=' "$ci_dockerfile"
          docker build --progress=plain \
            -f "$ci_dockerfile" \
            -t "$image" \
            .

      - name: Login and push to Alibaba Cloud ACR
        shell: bash
        run: |
          set -euo pipefail
          image="$ACR_REGISTRY/$ACR_NAMESPACE/dachuan-mcp:$MCP_IMAGE_TAG"
          printf '%s' "$ACR_PASSWORD" | docker login "$ACR_REGISTRY" -u "$ACR_USERNAME" --password-stdin
          docker push "$image"
          digest="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$image")"
          echo "MCP_IMAGE_READY=crpi-s9p349q5fuw3o6ud.cn-beijing.personal.cr.aliyuncs.com/dachuanpro/dachuan-mcp:1.1.0-identity-poc"
          echo "MCP_IMAGE_DIGEST=$digest"
