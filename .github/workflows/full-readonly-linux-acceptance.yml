name: FULL_READ_ONLY Linux 构建与隔离验收

on:
  workflow_dispatch:
  push:
    branches:
      - codex/unified-readonly-mcp
      - codex/mcp-canary-two-tools
    paths:
      - .github/workflows/full-readonly-linux-acceptance.yml
      - deploy/identity-acceptance/**
      - deploy/fastgpt/**
      - scripts/**
      - src/lib/agent-auth/**
      - src/lib/mcp/**
      - src/app/api/mcp/**

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -e -o pipefail {0}

concurrency:
  group: full-readonly-linux-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-accept-package:
    name: 构建、验收并打包
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      EXPECTED_MCP_TOOL_MODE: FULL_READ_ONLY
      IDENTITY_ACCEPTANCE_TOOL_MODE: FULL_READ_ONLY
      IDENTITY_ACCEPTANCE_AUTO_PROVISION_FASTGPT_KEY: "1"
      ACCEPTANCE_ARTIFACT_NAME: dachuan-full-readonly-linux-${{ github.run_id }}

    steps:
      - name: 拉取精确提交
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装固定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2

      - name: 清理可信临时 Runner 的无关工具缓存
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h
          docker version
          docker compose version

      - name: 验证基线和禁改文件
        run: |
          test -z "$(git status --short)"
          git merge-base --is-ancestor eb1c0fdd39001008006f8eb0dfdbe008b5d3a940 HEAD
          test -z "$(git diff eb1c0fdd39001008006f8eb0dfdbe008b5d3a940..HEAD --name-only -- package.json pnpm-lock.yaml prisma/schema.prisma prisma/migrations)"
          disallowed_mcp_changes="$(git diff eb1c0fdd39001008006f8eb0dfdbe008b5d3a940..HEAD --name-only -- src/lib/mcp | grep -vE '^src/lib/mcp/(application|config|tools|prisma-data-source)(\.test)?\.ts$' || true)"
          test -z "$disallowed_mcp_changes"
          test "$GITHUB_REF_NAME" = "codex/unified-readonly-mcp" || test "$GITHUB_REF_NAME" = "codex/mcp-canary-two-tools"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "GIT_SHA=$GITHUB_SHA"

      - name: Linux 脚本语法检查
        run: |
          bash -n deploy/identity-acceptance/start.sh
          bash -n deploy/identity-acceptance/accept.sh
          bash -n deploy/identity-acceptance/rollback.sh
          bash -n deploy/identity-acceptance/build-fastgpt.sh
          bash -n deploy/identity-acceptance/pull-external-images.sh
          bash -n deploy/identity-acceptance/package-linux-artifact.sh
          node --check deploy/identity-acceptance/validate-prebuilt-image-archive.mjs

      - name: 预构建外部镜像 tar 身份校验测试
        run: |
          node deploy/identity-acceptance/test-prebuilt-image-archive.mjs

      - name: 报告生成 dry-run 预检
        run: |
          node --check deploy/identity-acceptance/generate-linux-report.mjs
          report_dir="$RUNNER_TEMP/report-dry-run"
          mkdir -p "$report_dir"
          printf 'name\ttag\timageId\tsizeBytes\trepoDigests\nfastgpt\tdachuan-fastgpt:v4\tsha256:one\t1\t\n' > "$report_dir/IMAGE_IDS.tsv"
          printf 'image\tlinuxAmd64ManifestDigest\tociIndexDigest\tconfigDigest\tarchive\nmysql:8.0.44\tsha256:platform\tsha256:index\tsha256:config\tmysql.tar.gz\n' > "$report_dir/EXTERNAL_IMAGE_IDS.tsv"
          printf '{"overallStatus":"PASS","checks":["dry run"],"requestIdSummary":{"count":1,"uniqueCount":1}}' > "$report_dir/evidence.json"
          ARTIFACT_DIR="$report_dir" EVIDENCE_FILE="$report_dir/evidence.json" PREBUILT_REVALIDATED=PASS node deploy/identity-acceptance/generate-linux-report.mjs "$report_dir" "$report_dir/evidence.json"
          test -s "$report_dir/LINUX_ACCEPTANCE_REPORT.md"
          grep -F '`SHA256SUMS`' "$report_dir/LINUX_ACCEPTANCE_REPORT.md"
          grep -F '`docker load`' "$report_dir/LINUX_ACCEPTANCE_REPORT.md"
          grep -F '`--pull never`' "$report_dir/LINUX_ACCEPTANCE_REPORT.md"

      - name: 空缓存拉取并校验固定外部镜像
        run: |
          docker system prune --all --force --volumes
          test -z "$(docker image ls -q)"
          bash deploy/identity-acceptance/pull-external-images.sh
          docker image ls --digests

      - name: 生成仅限本次 Runner 的隔离环境
        run: |
          node deploy/identity-acceptance/prepare-env.mjs \
            deploy/identity-acceptance/.env.identity-acceptance.example \
            deploy/identity-acceptance/.env.identity-acceptance
          chmod 600 deploy/identity-acceptance/.env.identity-acceptance
          node deploy/identity-acceptance/validate-env.mjs deploy/identity-acceptance/.env.identity-acceptance

      - name: 完整执行 start.sh
        run: |
          set -o pipefail
          mkdir -p deploy/identity-acceptance/acceptance-output
          ./deploy/identity-acceptance/start.sh 2>&1 | tee deploy/identity-acceptance/acceptance-output/linux-start.log

      - name: 完整执行 accept.sh
        run: |
          set -o pipefail
          EXPECTED_MCP_TOOL_MODE=FULL_READ_ONLY ./deploy/identity-acceptance/accept.sh 2>&1 | tee deploy/identity-acceptance/acceptance-output/linux-accept.log

      - name: 完整执行 rollback.sh
        run: |
          set -o pipefail
          printf '%s\n' PURGE-IDENTITY-ACCEPTANCE | ./deploy/identity-acceptance/rollback.sh --purge-isolated-data 2>&1 | tee deploy/identity-acceptance/acceptance-output/linux-rollback.log
          test -z "$(docker compose -p dachuan-identity-acceptance --env-file deploy/identity-acceptance/.env.identity-acceptance -f deploy/identity-acceptance/docker-compose.yml ps -q)"
          test -z "$(docker volume ls -q --filter label=com.docker.compose.project=dachuan-identity-acceptance)"
          echo "IDENTITY_ACCEPTANCE_ROLLBACK=PASS"

      - name: 组装三镜像 Linux 验收成品
        env:
          IDENTITY_ACCEPTANCE_VERIFY_PREBUILT: "1"
        run: |
          ./deploy/identity-acceptance/package-linux-artifact.sh "$RUNNER_TEMP/$ACCEPTANCE_ARTIFACT_NAME"
          du -sh "$RUNNER_TEMP/$ACCEPTANCE_ARTIFACT_NAME"
          df -h

      - name: 上传可下载 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ACCEPTANCE_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/${{ env.ACCEPTANCE_ARTIFACT_NAME }}
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 14

      - name: 失败时安全停止隔离栈
        if: failure()
        run: |
          if [[ -f deploy/identity-acceptance/.env.identity-acceptance ]]; then
            ./deploy/identity-acceptance/rollback.sh || \
              docker compose -p dachuan-identity-acceptance \
                --env-file deploy/identity-acceptance/.env.identity-acceptance \
                -f deploy/identity-acceptance/docker-compose.yml down --remove-orphans
          fi
