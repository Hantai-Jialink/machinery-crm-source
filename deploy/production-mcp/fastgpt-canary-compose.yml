services:
  fastgpt-canary:
    image: ${FASTGPT_CANARY_IMAGE:?FASTGPT_CANARY_IMAGE is required}
    platform: linux/amd64
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://${CANARY_MONGO_ROOT_USER}:${CANARY_MONGO_ROOT_PASSWORD}@fastgpt-canary-mongo:27017/${CANARY_MONGO_DATABASE}?authSource=admin&replicaSet=rs0
      REDIS_URL: redis://default:${CANARY_REDIS_PASSWORD}@fastgpt-canary-redis:6379
      STORAGE_VENDOR: minio
      STORAGE_REGION: us-east-1
      STORAGE_ACCESS_KEY_ID: ${CANARY_MINIO_ROOT_USER}
      STORAGE_SECRET_ACCESS_KEY: ${CANARY_MINIO_ROOT_PASSWORD}
      STORAGE_PUBLIC_BUCKET: ${CANARY_STORAGE_PUBLIC_BUCKET}
      STORAGE_PRIVATE_BUCKET: ${CANARY_STORAGE_PRIVATE_BUCKET}
      STORAGE_S3_ENDPOINT: http://fastgpt-canary-minio:9000
      STORAGE_S3_FORCE_PATH_STYLE: "true"
      ROOT_KEY: ${CANARY_FASTGPT_ROOT_KEY}
      DEFAULT_ROOT_PSW: ${CANARY_FASTGPT_ROOT_PASSWORD}
      TOKEN_KEY: ${CANARY_FASTGPT_TOKEN_KEY}
      FILE_TOKEN_KEY: ${CANARY_FASTGPT_FILE_TOKEN_KEY}
      AES256_SECRET_KEY: ${CANARY_FASTGPT_AES_KEY}
      INVOKE_TOKEN_SECRET: ${CANARY_FASTGPT_INVOKE_TOKEN_SECRET}
      AIPROXY_API_ENDPOINT: http://fastgpt-canary-aiproxy:3000
      AIPROXY_API_TOKEN: ${CANARY_AIPROXY_ADMIN_KEY}
      PG_URL: postgresql://postgres:${CANARY_AIPROXY_POSTGRES_PASSWORD}@fastgpt-canary-aiproxy-postgres:5432/fastgpt
      PLUGIN_BASE_URL: http://fastgpt-canary-plugin:3000
      PLUGIN_TOKEN: ${CANARY_FASTGPT_PLUGIN_TOKEN:-REPLACE_WITH_CANARY_FASTGPT_PLUGIN_TOKEN}
      AGENT_ENGINE: ${FASTGPT_CANARY_AGENT_ENGINE:-fastAgent}
      NO_PROXY: localhost,127.0.0.1,fastgpt-canary-mongo,fastgpt-canary-redis,fastgpt-canary-minio,fastgpt-canary-aiproxy,fastgpt-canary-plugin
      no_proxy: localhost,127.0.0.1,fastgpt-canary-mongo,fastgpt-canary-redis,fastgpt-canary-minio,fastgpt-canary-aiproxy,fastgpt-canary-plugin
    ports:
      - "127.0.0.1:3110:3000"
    depends_on:
      fastgpt-canary-mongo-init:
        condition: service_completed_successfully
      fastgpt-canary-redis:
        condition: service_healthy
      fastgpt-canary-minio-init:
        condition: service_completed_successfully
      fastgpt-canary-aiproxy:
        condition: service_healthy
      fastgpt-canary-plugin:
        condition: service_healthy
      fastgpt-canary-pg-init:
        condition: service_completed_successfully
    networks: [fastgpt-canary-data, fastgpt-canary-ai-egress]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then((res) => { if (!res.ok) throw new Error(String(res.status)); })"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 90s
    labels:
      dachuan.canary.isolated: "true"

  fastgpt-canary-mongo-key-init:
    image: mongo:7.0@sha256:c8e9c92621124cd1da98f540c40157b9f6f338ba59babf296cf0f381ac8f60f4
    platform: linux/amd64
    restart: "no"
    network_mode: none
    volumes:
      - type: bind
        source: ${CANARY_MONGO_REPLICA_KEY_FILE:?CANARY_MONGO_REPLICA_KEY_FILE is required}
        target: /run/canary-secrets/mongodb-keyfile
        read_only: true
      - fastgpt-canary-mongo-key:/mongo-key
      - ./ci/mongo-key-init.sh:/usr/local/bin/dachuan-mongo-key-init:ro
    entrypoint: ["/bin/bash", "/usr/local/bin/dachuan-mongo-key-init"]

  fastgpt-canary-mongo:
    image: mongo:7.0@sha256:c8e9c92621124cd1da98f540c40157b9f6f338ba59babf296cf0f381ac8f60f4
    platform: linux/amd64
    command: ["mongod", "--auth", "--keyFile", "/etc/mongo-key/mongodb-keyfile", "--replSet", "rs0", "--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${CANARY_MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${CANARY_MONGO_ROOT_PASSWORD}
    volumes:
      - fastgpt-canary-mongo:/data/db
      - fastgpt-canary-mongo-key:/etc/mongo-key:ro
    depends_on:
      fastgpt-canary-mongo-key-init:
        condition: service_completed_successfully
    networks: [fastgpt-canary-data]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --host 127.0.0.1 --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --quiet --eval 'rs.status().ok' | grep -x 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  fastgpt-canary-mongo-init:
    image: mongo:7.0@sha256:c8e9c92621124cd1da98f540c40157b9f6f338ba59babf296cf0f381ac8f60f4
    platform: linux/amd64
    restart: "no"
    environment:
      CANARY_MONGO_ROOT_USER: ${CANARY_MONGO_ROOT_USER}
      CANARY_MONGO_ROOT_PASSWORD: ${CANARY_MONGO_ROOT_PASSWORD}
    volumes:
      - ./ci/mongo-replica-init.sh:/usr/local/bin/dachuan-mongo-replica-init:ro
    depends_on:
      fastgpt-canary-mongo:
        condition: service_started
    networks: [fastgpt-canary-data]
    entrypoint: ["/bin/bash", "/usr/local/bin/dachuan-mongo-replica-init"]

  fastgpt-canary-redis:
    image: redis:7.2-alpine@sha256:942b86c020b801daa83baee4ab6a125c244bf6dba7e5c6996d03e569e6aa1c19
    platform: linux/amd64
    environment:
      CANARY_REDIS_PASSWORD: ${CANARY_REDIS_PASSWORD}
    command: ["sh", "-ec", "exec redis-server --requirepass \"$$CANARY_REDIS_PASSWORD\" --appendonly yes"]
    volumes: ["fastgpt-canary-redis:/data"]
    networks: [fastgpt-canary-data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$CANARY_REDIS_PASSWORD\" ping | grep -x PONG"]
      interval: 10s
      timeout: 5s
      retries: 12

  fastgpt-canary-minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:3f97c5651cb6662b880c787a232b6b34fec8d8922e08d6617b25d241a21164bb
    platform: linux/amd64
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${CANARY_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${CANARY_MINIO_ROOT_PASSWORD}
    volumes: ["fastgpt-canary-minio:/data"]
    networks: [fastgpt-canary-data]
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20

  fastgpt-canary-minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z@sha256:2582c2f48b1e31545143ba5285c67d7b38c8b8f6912142d0630686dc7aaac28b
    platform: linux/amd64
    restart: "no"
    environment:
      CANARY_MINIO_ROOT_USER: ${CANARY_MINIO_ROOT_USER}
      CANARY_MINIO_ROOT_PASSWORD: ${CANARY_MINIO_ROOT_PASSWORD}
      CANARY_STORAGE_PUBLIC_BUCKET: ${CANARY_STORAGE_PUBLIC_BUCKET}
      CANARY_STORAGE_PRIVATE_BUCKET: ${CANARY_STORAGE_PRIVATE_BUCKET}
    depends_on:
      fastgpt-canary-minio:
        condition: service_healthy
    networks: [fastgpt-canary-data]
    volumes:
      - ./ci/minio-init.sh:/usr/local/bin/dachuan-minio-init:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/dachuan-minio-init"]

  fastgpt-canary-aiproxy-postgres:
    image: pgvector/pgvector:0.8.0-pg15@sha256:c50b98b074c4c370da995eb03c8f6bb6dcc2e9d8911e1974c1af981055a168e6
    platform: linux/amd64
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: aiproxy
      POSTGRES_PASSWORD: ${CANARY_AIPROXY_POSTGRES_PASSWORD}
    volumes: ["fastgpt-canary-aiproxy-postgres:/var/lib/postgresql/data"]
    networks: [fastgpt-canary-data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aiproxy"]
      interval: 5s
      timeout: 5s
      retries: 20

  fastgpt-canary-pg-init:
    image: pgvector/pgvector:0.8.0-pg15@sha256:c50b98b074c4c370da995eb03c8f6bb6dcc2e9d8911e1974c1af981055a168e6
    platform: linux/amd64
    restart: "no"
    environment:
      PGPASSWORD: ${CANARY_AIPROXY_POSTGRES_PASSWORD}
    command:
      - /bin/sh
      - -ec
      - |
        if ! psql -h fastgpt-canary-aiproxy-postgres -U postgres -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = 'fastgpt'" | grep -qx 1; then
          psql -h fastgpt-canary-aiproxy-postgres -U postgres -d postgres -c "CREATE DATABASE fastgpt"
        fi
    depends_on:
      fastgpt-canary-aiproxy-postgres:
        condition: service_healthy
    networks: [fastgpt-canary-data]

  fastgpt-canary-plugin:
    image: ghcr.io/labring/fastgpt-plugin:v1.0.2@sha256:a1a63eeef3d49c2a81db466243cf3ac88d9156b158076d4eece13e892dcd007f
    platform: linux/amd64
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://${CANARY_MONGO_ROOT_USER}:${CANARY_MONGO_ROOT_PASSWORD}@fastgpt-canary-mongo:27017/fastgpt-plugin?authSource=admin&replicaSet=rs0
      REDIS_URL: redis://default:${CANARY_REDIS_PASSWORD}@fastgpt-canary-redis:6379
      STORAGE_VENDOR: minio
      STORAGE_REGION: us-east-1
      STORAGE_ACCESS_KEY_ID: ${CANARY_MINIO_ROOT_USER}
      STORAGE_SECRET_ACCESS_KEY: ${CANARY_MINIO_ROOT_PASSWORD}
      STORAGE_PUBLIC_BUCKET: ${CANARY_STORAGE_PUBLIC_BUCKET}
      STORAGE_PRIVATE_BUCKET: ${CANARY_STORAGE_PRIVATE_BUCKET}
      STORAGE_S3_ENDPOINT: http://fastgpt-canary-minio:9000
      STORAGE_S3_FORCE_PATH_STYLE: "true"
      AUTH_TOKEN: ${CANARY_FASTGPT_PLUGIN_TOKEN:-REPLACE_WITH_CANARY_FASTGPT_PLUGIN_TOKEN}
      FASTGPT_BASE_URL: http://fastgpt-canary:3000
      DB_MAX_LINK: "100"
      MAX_API_SIZE: "10"
      NO_PROXY: localhost,127.0.0.1,fastgpt-canary-mongo,fastgpt-canary-redis,fastgpt-canary-minio,fastgpt-canary-aiproxy,fastgpt-canary,fastgpt-canary-plugin
      no_proxy: localhost,127.0.0.1,fastgpt-canary-mongo,fastgpt-canary-redis,fastgpt-canary-minio,fastgpt-canary-aiproxy,fastgpt-canary,fastgpt-canary-plugin
    depends_on:
      fastgpt-canary-mongo:
        condition: service_healthy
      fastgpt-canary-minio:
        condition: service_healthy
    networks: [fastgpt-canary-data, fastgpt-canary-ai-egress]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s

  fastgpt-canary-aiproxy:
    image: ${CANARY_AIPROXY_IMAGE:?CANARY_AIPROXY_IMAGE is required}
    platform: linux/amd64
    environment:
      ADMIN_KEY: ${CANARY_AIPROXY_ADMIN_KEY}
      SQL_DSN: postgresql://postgres:${CANARY_AIPROXY_POSTGRES_PASSWORD}@fastgpt-canary-aiproxy-postgres:5432/aiproxy
      LOG_DETAIL_STORAGE_HOURS: "1"
      RETRY_TIMES: "2"
      BILLING_ENABLED: "false"
      DISABLE_MODEL_CONFIG: "false"
      CANARY_MODEL_UPSTREAM_ENDPOINT: ${CANARY_MODEL_UPSTREAM_ENDPOINT}
      CANARY_MODEL_UPSTREAM_API_KEY: ${CANARY_MODEL_UPSTREAM_API_KEY}
    depends_on:
      fastgpt-canary-aiproxy-postgres:
        condition: service_healthy
    networks: [fastgpt-canary-data, fastgpt-canary-ai-egress]
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:3000/api/status"]
      interval: 10s
      timeout: 5s
      retries: 30

  # 仅 CI profile 使用的确定性 OpenAI 兼容模型；正式 Compose 不会启动它。
  fastgpt-canary-model-mock:
    image: node:24.16.0-alpine@sha256:bc23e6976e92708e9eadae437d7dd180b3fd47ed75edf322d6cfa36eba4a7fc8
    platform: linux/amd64
    profiles: ["ci"]
    volumes:
      - ./ci/model-mock.mjs:/app/model-mock.mjs:ro
    command: ["node", "/app/model-mock.mjs"]
    networks: [fastgpt-canary-data]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  fastgpt-canary-data:
    name: dachuan-fastgpt-canary-data
    internal: true
  fastgpt-canary-ai-egress:
    name: dachuan-fastgpt-canary-ai-egress
    internal: false

volumes:
  fastgpt-canary-mongo:
    name: dachuan-fastgpt-canary-mongo
  fastgpt-canary-mongo-key:
    name: dachuan-fastgpt-canary-mongo-key
  fastgpt-canary-redis:
    name: dachuan-fastgpt-canary-redis
  fastgpt-canary-minio:
    name: dachuan-fastgpt-canary-minio
  fastgpt-canary-aiproxy-postgres:
    name: dachuan-fastgpt-canary-aiproxy-postgres
