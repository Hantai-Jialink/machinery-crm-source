services:
  dachuanpro-mcp-redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - dachuanpro-mcp-prod-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      dachuan-mcp-prod:
        ipv4_address: 172.30.31.11

  dachuanpro-mcp:
    image: ${MCP_IMAGE:?MCP_IMAGE is required}
    restart: unless-stopped
    env_file:
      - ${PRODUCTION_ENV_FILE:?PRODUCTION_ENV_FILE is required}
    depends_on:
      dachuanpro-mcp-redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:3010:3010"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      dachuan-mcp-prod:
        ipv4_address: 172.30.31.10
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3010/api/mcp/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  dachuanpro-mcp-prod-redis:

networks:
  dachuan-mcp-prod:
    name: dachuan-mcp-prod
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.31.0/28
